[build]
  base = "client"
  command = "npm run build"
  publish = "build/client"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
from = "/graphql"
to = "https://as-above-tattoo-slc-production.up.railway.app/graphql"
status = 200
force = true
signed = "API_SIGNATURE_TOKEN"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

